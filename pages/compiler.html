    <section class="work-page page-compiler" id="page-compiler" hidden>
        <div class="cp-view" id="compilerView">
            <div class="cp-bar" role="toolbar" aria-label="Compiler">
                <span class="work-count" id="compilerCount">No file</span>
                <span class="cp-rule" aria-hidden="true"></span>
                <button type="button" id="compilerUploadBtn">Upload</button>
                <div class="cp-dl">
                    <button type="button" id="compilerDownloadBtn" disabled>Download</button>
                    <div class="export-menu" id="compilerDownloadMenu" hidden>
                        <button type="button" data-cp-fmt="txt">Plain text</button>
                        <button type="button" data-cp-fmt="md">Markdown</button>
                        <button type="button" data-cp-fmt="json">JSON</button>
                        <button type="button" data-cp-fmt="html">HTML</button>
                        <button type="button" data-cp-fmt="csv">CSV</button>
                        <button type="button" data-cp-fmt="xml">XML</button>
                    </div>
                </div>
                <button type="button" id="compilerInspectBtn" disabled>Inspect</button>
            </div>
            <div class="cp-drop" id="compilerDrop">
                <strong>Drop a file</strong>
                <span>Tags and symbols stay in the record.</span>
                <span class="cp-kinds">.txt · .md · .json · .html · .csv · .xml</span>
                <button type="button" class="work-ghost" id="compilerDropBtn">Choose files</button>
            </div>
            <div class="cp-result" id="compilerResult" hidden></div>
            <div class="cp-load" id="compilerLoad" hidden>
                <span class="cp-spin" aria-hidden="true"></span>
                <strong id="compilerLoadTitle">Compiling</strong>
                <span id="compilerLoadHint">Lining up the file…</span>
            </div>
        </div>
        <input id="compilerFile" type="file" accept=".txt,.md,.json,.html,.htm,.csv,.xml,text/plain,text/markdown,application/json,text/html,text/csv,text/xml,application/xml" multiple hidden>
    </section>
