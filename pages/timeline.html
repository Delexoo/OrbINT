    <section class="work-page page-timeline" id="page-timeline" hidden>
        <header class="work-top">
            <div>
                <div class="work-kicker">Chronology</div>
                <h2>Timeline</h2>
                <p class="work-lead">A pan-and-zoom axis. Double-click the line to add an event. Type on a card, attach a photo, drag to place it.</p>
            </div>
            <div class="work-tools">
                <span class="work-count" id="timelineCount">No events</span>
                <button type="button" id="timelineConnectBtn" data-tl-connect>Connect cards</button>
                <button type="button" id="timelineAdd">Add event</button>
                <button type="button" id="timelineDelete" class="danger">Delete</button>
                <button type="button" id="timelineZoomOut" aria-label="Zoom out">−</button>
                <span class="work-count" id="timelineZoomLabel">100%</span>
                <button type="button" id="timelineZoomIn" aria-label="Zoom in">+</button>
                <button type="button" id="timelineRecenter">Recenter</button>
            </div>
        </header>
        <div class="tl-view" id="timelineView">
            <div class="tl-stage" id="timelineStage">
                <div id="timelineList"></div>
                <svg id="timelineAxis" aria-hidden="true"></svg>
                <div class="tl-follow" id="timelineFollow" hidden></div>
            </div>
            <div class="board-add-menu" id="timelineMenu" hidden></div>
            <div class="tl-island is-on" id="timelineIsland" role="status" aria-live="polite">
                <span class="tl-island-ico tl-island-ico-hint" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M3 12h18"/><path d="M8 12v-3M16 12v-3"/><circle cx="12" cy="12" r="2"/></svg>
                </span>
                <span class="tl-island-ico tl-island-ico-link" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><circle cx="6.5" cy="12" r="2.4"/><circle cx="17.5" cy="12" r="2.4"/><path d="M9 12h6"/></svg>
                </span>
                <span class="tl-island-text" id="timelineIslandText">Click the number line to add a card</span>
            </div>
        </div>
        <input id="timelineImageFile" type="file" accept="image/*" hidden>
    </section>
