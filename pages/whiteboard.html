    <section class="work-page page-whiteboard" id="page-whiteboard" hidden>
        <div class="board-view" id="boardView">
            <div class="board-toolbar" role="toolbar" aria-label="Whiteboard">
                <span class="board-tool-thumb" aria-hidden="true"></span>
                <button type="button" class="board-ico" data-board-lock title="Keep tool selected" aria-label="Keep tool selected">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="11" width="10" height="8" rx="1.5"/><path d="M9 11V8a3 3 0 0 1 6 0v3"/></svg>
                </button>
                <span class="board-rule" aria-hidden="true"></span>
                <button type="button" class="board-ico" data-board-tool="pan" title="Hand (H)" aria-label="Hand">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 11V7.5a1.5 1.5 0 0 1 3 0V11"/><path d="M11 10.5V6.5a1.5 1.5 0 0 1 3 0V11"/><path d="M14 10V8.5a1.5 1.5 0 0 1 3 0V14c0 3-1.7 5-4.5 5H12a5 5 0 0 1-5-4.2L6 11.5A1.6 1.6 0 0 1 8.8 10"/></svg>
                </button>
                <button type="button" class="board-ico board-ico-fill is-on" data-board-tool="select" title="Selection tool (V)" aria-label="Selection tool">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3v16l4.2-4.1 2.6 6.2 2.8-.9-2.6-6.2H19z"/></svg>
                </button>
                <span class="board-rule" aria-hidden="true"></span>
                <button type="button" class="board-ico" data-board-tool="square" title="Rectangle (R)" aria-label="Rectangle">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="1.5"/></svg>
                </button>
                <button type="button" class="board-ico" data-board-tool="diamond" title="Diamond (D)" aria-label="Diamond">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4 20 12 12 20 4 12z"/></svg>
                </button>
                <button type="button" class="board-ico" data-board-tool="circle" title="Circle (O)" aria-label="Circle">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7"/></svg>
                </button>
                <button type="button" class="board-ico" data-board-tool="triangle" title="Triangle" aria-label="Triangle">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5.5 20 18.5H4z"/></svg>
                </button>
                <span class="board-rule" aria-hidden="true"></span>
                <button type="button" class="board-ico" data-board-tool="arrow" title="Arrow (A)" aria-label="Arrow">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h14"/><path d="M14 8l4 4-4 4"/></svg>
                </button>
                <button type="button" class="board-ico" data-board-tool="line" title="Line (L)" aria-label="Line">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16"/></svg>
                </button>
                <button type="button" class="board-ico" data-board-tool="draw" title="Draw (P)" aria-label="Draw">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 16c2-6 4-9 7-9 4 0 3 8 7 8"/></svg>
                </button>
                <span class="board-rule" aria-hidden="true"></span>
                <button type="button" class="board-ico board-ico-type" data-board-tool="text" title="Text (T)" aria-label="Text">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><text x="12" y="18" text-anchor="middle" font-family="'Times New Roman', Times, serif" font-size="17" font-weight="700">A</text></svg>
                </button>
                <button type="button" class="board-ico" data-board-tool="note" title="Sticky note (N)" aria-label="Sticky note">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5.5" y="4.5" width="13" height="15.5" rx="1"/><path d="M8 9.5h8M8 12.5h8M8 15.5h5"/><path d="M8.5 4.5h7v2.2h-7z"/></svg>
                </button>
                <button type="button" class="board-ico" data-board-tool="image" title="Image (I)" aria-label="Image">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="2"/><circle cx="9" cy="10" r="1.4"/><path d="M7 17l4-4 3 3 3-2 3 3"/></svg>
                </button>
                <button type="button" class="board-ico" data-board-tool="eraser" title="Eraser (E)" aria-label="Eraser">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 15 15 7l3 3-8 8H7z"/><path d="M7 18h13"/></svg>
                </button>
                <span class="board-rule" aria-hidden="true"></span>
                <button type="button" class="board-ico" data-board-tool="connect" title="Connect shapes (Q)" aria-label="Connect shapes">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6.5" cy="12" r="2.4"/><circle cx="17.5" cy="12" r="2.4"/><path d="M9 12h6"/></svg>
                </button>
                <button type="button" class="board-ico" data-board-presets title="Pre-sets" aria-label="Pre-sets">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4.5" width="7" height="7" rx="1.2"/><rect x="13" y="4.5" width="7" height="7" rx="1.2"/><rect x="4" y="13.5" width="7" height="6" rx="1.2"/><rect x="13" y="13.5" width="7" height="6" rx="1.2"/></svg>
                </button>
                <button type="button" class="board-ico" data-board-more title="More" aria-label="More">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="18" cy="12" r="1.4"/></svg>
                </button>
            </div>
            <div class="board-more" id="boardMoreMenu" hidden>
                <button type="button" data-board-tool="image">
                    <svg class="board-mi" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="2"/><circle cx="9" cy="10" r="1.4"/><path d="M7 17l4-4 3 3 3-2 3 3"/></svg>
                    <span>Insert image</span><kbd>9</kbd>
                </button>
                <button type="button" data-board-tool="frame">
                    <svg class="board-mi" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="1.5" stroke-dasharray="2.4 2"/><path d="M4 9h16"/></svg>
                    <span>Frame tool</span><kbd>F</kbd>
                </button>
                <button type="button" data-board-tool="embed">
                    <svg class="board-mi" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 9 5 12l3 3M16 9l3 3-3 3"/></svg>
                    <span>Web Embed</span>
                </button>
                <button type="button" data-board-action="draw-shape">
                    <svg class="board-mi" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 16c2-6 4-9 7-9 4 0 3 8 7 8"/><path d="M16 5l1.2 2.4L20 8l-2.4 1.2L16 12l-1.2-2.8L12 8l2.8-.6z"/></svg>
                    <span>Draw to shape</span><kbd>Shift+X</kbd>
                </button>
                <button type="button" data-board-tool="laser">
                    <svg class="board-mi" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v5M9 10l7 9"/><circle cx="12" cy="3.6" r="1.2"/></svg>
                    <span>Laser pointer</span><kbd>K</kbd>
                </button>
                <button type="button" data-board-tool="bucket">
                    <svg class="board-mi" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 10h9l-1.6 8H9.4z"/><path d="M10 10V7.5a2 2 0 0 1 4 0"/><path d="M17.5 14.5c1.4 0 2.5 1 2.5 2.2S19 19 17.5 19"/></svg>
                    <span>Bucket fill</span><kbd>B</kbd>
                </button>
                <button type="button" data-board-tool="lasso">
                    <svg class="board-mi" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 14c0-3.6 3-6.5 6.5-6.5S20 9.8 20 13s-2.8 5-5.6 5"/><circle cx="7.5" cy="16.5" r="2.2"/></svg>
                    <span>Lasso selection</span>
                </button>
                <div class="board-more-label">Generate</div>
                <button type="button" data-board-action="text-diagram">
                    <svg class="board-mi" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="7" height="5" rx="1"/><rect x="13" y="14" width="7" height="5" rx="1"/><path d="M7.5 10v3H16"/></svg>
                    <span>Text to diagram</span><em class="board-ai">AI</em>
                </button>
                <button type="button" data-board-action="mermaid">
                    <svg class="board-mi" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 16c2.2-8 4.8-10 7-10s4.8 2 7 10"/><path d="M8 12h8"/></svg>
                    <span>Mermaid to diagram</span>
                </button>
                <button type="button" data-board-action="wireframe">
                    <svg class="board-mi" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="1.5"/><path d="M4 10h16M10 10v9"/></svg>
                    <span>Wireframe to code</span><em class="board-ai">AI</em>
                </button>
                <hr>
                <select id="boardPlaybook" aria-label="Playbook">
                    <option value="username">Username playbook</option>
                    <option value="email">Email playbook</option>
                    <option value="domain">Domain playbook</option>
                    <option value="phone">Phone playbook</option>
                    <option value="name">Person playbook</option>
                    <option value="image">Image playbook</option>
                    <option value="vehicle">Vehicle playbook</option>
                </select>
                <button type="button" id="boardInsertPlaybook">Insert playbook</button>
            </div>
            <aside class="board-props" id="boardInspect" hidden>
                <b>Stroke</b>
                <div class="board-swatches" id="boardStrokeSwatches"></div>
                <div class="board-prop-shape">
                <b>Fill</b>
                <div class="board-swatches" id="boardFillSwatches"></div>
                </div>
                <b>Width</b>
                <div class="board-seg">
                    <button type="button" data-board-sw="1.25" aria-label="Thin">–</button>
                    <button type="button" data-board-sw="1.75" aria-label="Medium">—</button>
                    <button type="button" data-board-sw="2.75" aria-label="Thick">━</button>
                </div>
                <b>Stroke style</b>
                <div class="board-seg">
                    <button type="button" data-board-dash="solid" aria-label="Solid">━</button>
                    <button type="button" data-board-dash="dashed" aria-label="Dashed">╌</button>
                    <button type="button" data-board-dash="dotted" aria-label="Dotted">···</button>
                </div>
                <div class="board-prop-shape">
                <b>Rounded edges</b>
                <input id="boardRadius" type="range" min="0" max="50" value="12" aria-label="Rounded edges">
                </div>
                <b>Opacity</b>
                <input id="boardOpacity" type="range" min="0" max="100" value="100" aria-label="Opacity">
                <b>Arrange</b>
                <div class="board-seg">
                    <button type="button" data-board-layer="back" title="Send back">↓</button>
                    <button type="button" data-board-layer="forward" title="Bring forward">↑</button>
                    <button type="button" id="boardDuplicate" title="Duplicate">⧉</button>
                    <button type="button" id="boardDelete" class="danger" title="Delete">✕</button>
                </div>
            </aside>
            <p class="board-hint" id="boardHint" hidden></p>
            <div class="board-empty" id="boardEmpty">
                <strong>Whiteboard</strong>
                <span>Pick a tool and drag to place. Draw to sketch a line. Ctrl+Z undoes.</span>
            </div>
            <div class="board-shift" id="boardShift">
                <div class="board-stage" id="boardStage">
                    <svg id="boardLinks" aria-hidden="true" overflow="visible"></svg>
                    <svg id="boardOverlay" class="wb-overlay" aria-hidden="true"></svg>
                </div>
            </div>
            <div class="board-add-menu" id="boardAddMenu" hidden></div>
            <input id="boardImageFile" type="file" accept="image/*" hidden>
            <input id="boardSizeW" type="hidden">
            <input id="boardSizeH" type="hidden">
            <button type="button" id="boardAdd" hidden>Add</button>
            <button type="button" id="boardEditBtn" hidden>Edit</button>
        </div>
    </section>
